name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i 's/try{window.close()}catch(e){}};/try{window.close()}catch(e){}try{window.Capacitor\&\&Capacitor.Plugins\&\&Capacitor.Plugins.App\&\&Capacitor.Plugins.App.exitApp()}catch(e){}};/' www/index.html
          curl -L -f -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mahalanth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
